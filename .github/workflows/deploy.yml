name: Deploy to GitHub Pages

on:
  # Bei jedem Push auf main bauen und veröffentlichen
  push:
    branches: [main]
  # Täglicher Rebuild, damit neue Podcast-Folgen aus dem RSS-Feed
  # automatisch auf der Seite erscheinen (Build lädt den Feed neu).
  schedule:
    - cron: '0 5 * * *'
  # Manuelles Auslösen im Actions-Tab erlauben
  workflow_dispatch:

# Berechtigungen für das GitHub-Pages-Deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein gleichzeitiges Deployment; laufende Läufe nicht abbrechen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Volle Historie: die Sitemap liest daraus das Änderungsdatum je Seite
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build with Astro
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Bing, Yandex & Co. per IndexNow sofort über die neue Version informieren.
  # Bing ist auch die Suchgrundlage von ChatGPT und Copilot. Nicht beim
  # täglichen Rebuild, da ändert sich höchstens die Podcast-Liste. Ein Fehler
  # hier lässt den Lauf nicht scheitern — die Seite ist ja schon online.
  indexnow:
    needs: deploy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # Öffentlicher Schlüssel, liegt als public/<KEY>.txt auf der Seite
      KEY: 341308679f145dd8ceb9a77aba65fda0
    steps:
      - name: URLs aus der Sitemap an IndexNow melden
        run: |
          urls=$(curl -fsS https://geldverstehen.de/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed -E 's#</?loc>##g' | jq -R . | jq -sc .)
          jq -n --arg key "$KEY" --argjson urls "$urls" \
            '{host: "geldverstehen.de", key: $key, keyLocation: "https://geldverstehen.de/\($key).txt", urlList: $urls}' \
          | curl -fsS -X POST https://api.indexnow.org/indexnow \
              -H 'Content-Type: application/json; charset=utf-8' --data-binary @-
